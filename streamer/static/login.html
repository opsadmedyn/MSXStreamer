<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Media Syntaxis Streamer</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;800&display=swap" rel="stylesheet">
<style>
  :root { --fondo:#0f1115; --panel:#171a21; --borde:#262b36; --texto:#e6e9ef; --suave:#9aa4b5;
          --acento:#FF5A00; --error:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--fondo); color:var(--texto);
         font:15px/1.5 Montserrat,"Helvetica Neue",Arial,sans-serif; padding:16px; }
  .caja { background:var(--panel); border:1px solid var(--borde); border-radius:12px;
          padding:26px; width:100%; max-width:380px; }
  h1 { margin:0 0 18px; }
  h1 img { width:100%; max-width:260px; display:block; margin:0 auto 6px; }
  h1 small { display:block; text-align:center; color:var(--acento); font-size:12px; text-transform:uppercase; letter-spacing:1.4px; font-weight:500; }
  label { display:block; font-size:12px; color:var(--suave); margin-bottom:6px; }
  input { width:100%; background:#10141c; border:1px solid var(--borde); color:var(--texto);
          border-radius:8px; padding:11px 12px; font-size:16px; margin-bottom:12px; }
  button { width:100%; background:var(--acento); color:#fff; border:0; border-radius:8px;
           padding:11px; font-size:15px; cursor:pointer; font-family:inherit; }
  button:disabled { opacity:.5; cursor:wait; }
  .aviso { min-height:20px; font-size:13px; margin-top:10px; color:var(--error); }
</style>
</head>
<body>
<div class="caja">
  <h1><img src="/static/logo.svg" alt="MediaSyntaxis"><small>Streamer</small></h1>
  <form id="f">
    <label for="clave">Clave del panel</label>
    <input id="clave" type="password" autocomplete="current-password" autofocus required>
    <button id="b">Entrar</button>
    <div class="aviso" id="aviso"></div>
  </form>
</div>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const b = document.getElementById('b'), aviso = document.getElementById('aviso');
  b.disabled = true; aviso.textContent = '';
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({clave: document.getElementById('clave').value})});
    if (r.ok) { location.href = '/'; return; }
    aviso.textContent = (await r.json()).detail || 'No se pudo entrar';
  } catch { aviso.textContent = 'El servidor no responde'; }
  b.disabled = false;
};
</script>
</body>
</html>
