# Media Syntaxis Streamer - configuración de MediaMTX.
# Solo lo que difiere de los valores por defecto. Los paths los declara el supervisor por la API
# (no se guardan aquí), así que no hace falta editar este archivo para crear flujos.

logLevel: info
logDestinations: [stdout]

# API solo en local: la usan el panel y el supervisor
api: yes
apiAddress: 127.0.0.1:9997

# Búfer de los sockets UDP (reenvío del Recorder, ~8 Mbps a ráfagas). Con el del sistema (208 KB)
# se pierden paquetes y la salida sale con macrobloques. Necesita net.core.rmem_max >= este valor
# (lo pone desplegar.sh --instalar en /etc/sysctl.d/60-msx-streamer.conf).
udpReadBufferSize: 8388608

# SRT: entradas pull (las abre MediaMTX), el reenvío del Recorder y la lectura de las salidas
srt: yes
srtAddress: :8890

# HLS bajo demanda: http://<equipo>:8888/<flujo>/ solo responde si el flujo tiene un destino HLS
# activo en el panel (o con el token de la vista previa). Sin alwaysRemux, el HLS de un flujo
# solo se genera mientras alguien lo mira.
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: no

# Cada lectura se consulta al panel (/api/mtx/auth), que decide el HLS. La API local, métricas
# y publicaciones no pasan por ahí. Si el panel está parado, no se abren lecturas nuevas.
authMethod: http
authHTTPAddress: http://127.0.0.1:8095/api/mtx/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof
  - action: publish

# Protocolos que no usa la fase 1
rtsp: no
rtmp: no
webrtc: no
playback: no
metrics: no
pprof: no
moq: no        # desde la v1.21 abre además :8892 y :8893 si no se apaga

paths: {}
